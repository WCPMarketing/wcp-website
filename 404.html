<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting… | Wireless Communications Plus</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F6F6F4; color: #222; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px; }
  a { color: #B40E2A; font-weight: 600; }
</style>
<script>
  // Forward any unmatched path + hash straight to the same path on the portal subdomain.
  // e.g. wcpwireless.com/orea#Home -> portal.wcpwireless.com/orea#Home
  var target = "https://portal.wcpwireless.com" + window.location.pathname + window.location.search + window.location.hash;
  window.location.replace(target);
</script>
</head>
<body>
  <p id="fallback-text">
    Redirecting you to the right page…<br>
    If you're not redirected automatically, <a id="fallback-link" href="#">click here</a>.
  </p>
  <script>
    document.getElementById('fallback-link').href = target;
  </script>
</body>
</html>
